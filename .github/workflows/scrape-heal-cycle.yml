name: DocMind Autonomous Scrape & Self-Healing Cycle

on:
  # Daily cron schedule at 04:00 UTC
  schedule:
    - cron: '0 4 * * *'

  # Manual trigger fallback (per SRS FR-601: "manual trigger fallback always available")
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Documentation Site URL (defaults to configured secret or settings)'
        required: false
        default: 'https://docs.litellm.ai'
      collector_id:
        description: 'Bright Data Collector ID (defaults to configured secret or state)'
        required: false
        default: ''
      auto_approve:
        description: 'Auto-approve proposed heals (true for unattended CI execution)'
        required: true
        type: boolean
        default: true

jobs:
  scrape-validate-heal:
    name: Scrape, Validate, Self-Heal & Re-Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js (for Bright Data CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unattended Automation Cycle
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TARGET_DOCS_URL: ${{ github.event.inputs.target_url || secrets.TARGET_DOCS_URL || 'https://docs.litellm.ai' }}
          BRIGHTDATA_COLLECTOR_ID: ${{ github.event.inputs.collector_id || secrets.BRIGHTDATA_COLLECTOR_ID || 'c_msyg7ceoo6la3ofn6' }}
          DOCMIND_AUTO_APPROVE_HEALS: ${{ github.event.inputs.auto_approve || 'true' }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY || 'github_actions_session_secret_default_key_32bytes' }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY || 'github_actions_ci_admin_key_12345' }}
        run: |
          python scripts/run_automation_cycle.py

      - name: Upload Automation Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docmind-automation-report
          path: |
            data/logs/automation_report.json
            data/logs/automation_summary.md
          retention-days: 30
